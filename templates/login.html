{% extends "layout.html" %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-card-header">
            <h2 class="form-heading">Welcome back</h2>
            <p class="form-subheading">Sign in to your Transit Matchmaker account</p>
        </div>

        <form action="/login" method="POST">
            <div class="field">
                <label class="field-label" for="email">College Email</label>
                <input class="field-input" type="email" id="email" name="email" placeholder="you@svnit.ac.in" autocomplete="email" required>
            </div>
            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input class="field-input" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" required>
            </div>
            <div class="form-submit">
                <button type="submit" class="btn-primary btn-full" style="padding:11px;">Sign In</button>
            </div>
        </form>

        <div class="form-divider">or</div>

        <div class="form-footer">
            <p>Don't have an account? <a href="/register">Create one</a></p>
        </div>
    </div>
</div>
{% endblock %}
