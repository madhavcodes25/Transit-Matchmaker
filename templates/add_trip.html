{% extends "layout.html" %}

{% block content %}
<div class="form-page">
    <div class="form-card form-card-wide">
        <div class="form-card-header">
            <h2 class="form-heading">Post a Trip</h2>
            <p class="form-subheading">Share your travel details to find commute buddies and split fares.</p>
        </div>

        <form action="/add_trip" method="POST">
            <div class="field">
                <label class="field-label" for="departure_point">Leaving From</label>
                <input class="field-input" type="text" id="departure_point" name="departure_point"
                       placeholder="e.g., SVNIT Hostel B, Main Gate" required>
            </div>

            <div class="field">
                <label class="field-label" for="destination">Destination</label>
                <select class="field-input" id="destination" name="destination" required>
                    <option value="" selected disabled>Choose your destination...</option>
                    <option value="Surat Railway Station">Surat Railway Station</option>
                    <option value="Surat Airport">Surat Airport</option>
                    <option value="Bus Stand">Central Bus Stand</option>
                </select>
            </div>

            <div class="field">
                <label class="field-label" for="travel_date">Date of Travel</label>
                <input class="field-input" type="date" id="travel_date" name="travel_date" required>
            </div>

            <div class="field">
                <label class="field-label">Departure Window</label>
                <div class="field-row">
                    <div>
                        <label class="field-label" for="time_window_start"
                               style="font-size:0.68rem; opacity:0.7; margin-bottom:5px;">Earliest</label>
                        <input class="field-input" type="time" id="time_window_start"
                               name="time_window_start" required>
                    </div>
                    <div>
                        <label class="field-label" for="time_window_end"
                               style="font-size:0.68rem; opacity:0.7; margin-bottom:5px;">Latest</label>
                        <input class="field-input" type="time" id="time_window_end"
                               name="time_window_end" required>
                    </div>
                </div>
                <p class="field-hint">Set the range of times you are available to leave.</p>
            </div>

            <!-- Recurring toggle -->
            <div class="field">
                <label class="recurring-toggle">
                    <input type="checkbox" id="is_recurring" name="is_recurring" value="1">
                    <span class="toggle-switch"></span>
                    <div class="toggle-label">
                        <span class="toggle-title">Repeat weekly</span>
                        <span class="toggle-desc">This trip will automatically roll over every week on the same day</span>
                    </div>
                </label>
            </div>

            <div class="form-submit" style="margin-top:1.5rem;">
                <button type="submit" class="btn-success btn-full" style="padding:11px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Post Trip
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
