{% extends "layout.html" %}

{% block content %}
<div class="form-page">
    <div class="form-card">
        <div class="form-card-header">
            <h2 class="form-heading">Create an account</h2>
            <p class="form-subheading">Join Transit Matchmaker and save on commutes</p>
        </div>

        <form action="/register" method="POST">
            <div class="field">
                <label class="field-label" for="name">Full Name</label>
                <input class="field-input" type="text" id="name" name="name"
                       placeholder="Your full name" autocomplete="name" required>
            </div>
            <div class="field">
                <label class="field-label" for="email">College Email</label>
                <input class="field-input" type="email" id="email" name="email"
                       placeholder="you@svnit.ac.in" autocomplete="email" required>
            </div>
            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input class="field-input" type="password" id="password" name="password"
                       placeholder="Choose a strong password" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label class="field-label" for="phone">
                    WhatsApp Number
                    <span class="field-optional">Optional</span>
                </label>
                <input class="field-input" type="tel" id="phone" name="phone"
                       placeholder="+91 98765 43210" autocomplete="tel">
                <p class="field-hint">Lets your commute buddies reach you on WhatsApp.</p>
            </div>

            <div class="form-submit">
                <button type="submit" class="btn-primary btn-full" style="padding:11px;">
                    Create Account
                </button>
            </div>
        </form>

        <div class="form-divider">or</div>

        <div class="form-footer">
            <p>Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>
</div>
{% endblock %}
